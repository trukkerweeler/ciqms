<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Training Matrix" />
    <meta name="author" content="Tim Kent" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" href="images/ci-logo.png" />
    <title>Training Matrix (CIQMS)</title>
    <style>
      .matrix-tabs {
        display: flex;
        gap: 4px;
        border-bottom: 2px solid #ccc;
        margin: 0 0 20px 0;
        padding: 0 4px;
      }
      .matrix-tab {
        padding: 8px 20px;
        border: 1px solid #ccc;
        border-bottom: none;
        background: #f5f5f5;
        cursor: pointer;
        border-radius: 4px 4px 0 0;
        font-size: 0.95rem;
        position: relative;
        bottom: -2px;
      }
      .matrix-tab.active {
        background: #fff;
        border-bottom: 2px solid #fff;
        font-weight: bold;
        color: #1a6496;
      }
      .matrix-panel {
        display: none;
      }
      .matrix-panel.active {
        display: block;
      }

      .matrix-controls {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .matrix-controls label {
        font-weight: bold;
      }
      .matrix-controls select {
        padding: 6px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        min-width: 260px;
        font-family: inherit;
        font-size: 0.95rem;
      }

      .matrix-employee-header {
        background: #f0f4f8;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        padding: 12px 16px;
        margin-bottom: 20px;
      }
      .matrix-employee-header h2 {
        margin: 0 0 8px 0;
        font-size: 1.2rem;
      }
      .matrix-summary {
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 0.9rem;
      }

      .matrix-job-section {
        margin-bottom: 28px;
      }
      .matrix-job-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 8px;
        background: #e8f0f7;
        border-left: 4px solid #1a6496;
        padding: 8px 12px;
        margin-bottom: 0;
        font-size: 0.9rem;
      }
      .matrix-job-header h3 {
        margin: 0;
        font-size: 1.05rem;
        color: #1a6496;
      }

      .matrix-table td:first-child {
        min-width: 160px;
      }
      .matrix-table small {
        font-size: 0.78em;
      }

      .status-icon {
        font-size: 1.1rem;
        font-weight: bold;
      }
      .status-icon.trained {
        color: #27ae60;
      }
      .status-icon.partial {
        color: #e67e22;
      }
      .status-icon.not-trained {
        color: #c0392b;
      }

      .pct-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 12px;
        font-weight: bold;
        font-size: 0.85rem;
        color: #fff;
      }
      .pct-badge.green {
        background: #27ae60;
      }
      .pct-badge.yellow {
        background: #e67e22;
      }
      .pct-badge.red {
        background: #c0392b;
      }

      .progress-bar-wrap {
        background: #ddd;
        border-radius: 4px;
        height: 8px;
        width: 80px;
        display: inline-block;
        vertical-align: middle;
        margin-right: 4px;
      }
      .progress-bar-fill {
        height: 100%;
        border-radius: 4px;
        min-width: 4px;
      }
      .progress-bar-fill.green {
        background: #27ae60;
      }
      .progress-bar-fill.yellow {
        background: #e67e22;
      }
      .progress-bar-fill.red {
        background: #c0392b;
      }

      .loading {
        color: #888;
        font-style: italic;
      }
      .error {
        color: #c0392b;
      }

      #allMatrixContainer tr {
        cursor: pointer;
      }
      #allMatrixContainer tr:hover {
        background-color: #f0f7ff !important;
      }
    </style>
  </head>
  <body>
    <header id="header"></header>
    <div class="recordsaddrecordheading">
      <h1>Training Matrix</h1>
    </div>

    <main id="main">
      <div class="matrix-tabs">
        <button class="matrix-tab active" data-panel="employeePanel">
          By Employee
        </button>
        <button class="matrix-tab" data-panel="allPanel">All Employees</button>
      </div>

      <!-- By Employee Panel -->
      <div id="employeePanel" class="matrix-panel active">
        <div class="matrix-controls">
          <label for="employeeSelect">Employee:</label>
          <select id="employeeSelect">
            <option value="">-- Select Employee --</option>
          </select>
        </div>
        <div id="matrixContainer">
          <p style="color: #888">
            Select an employee to view their training matrix.
          </p>
        </div>
      </div>

      <!-- All Employees Panel -->
      <div id="allPanel" class="matrix-panel">
        <div id="allMatrixContainer">
          <p class="loading">Loading&hellip;</p>
        </div>
      </div>
    </main>

    <footer id="footer"></footer>
    <script type="module" src="/js/trainingmatrix.mjs"></script>
  </body>
</html>

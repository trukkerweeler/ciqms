<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Skills Management" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/skills.css" />
    <title>Skills (CIQMS)</title>
  </head>

  <body class="skills-page">
    <header id="header"></header>
    <div class="recordsaddrecordheading">
      <h1>Skills</h1>
      <button
        class="addrecordheadingbutton button"
        id="addSkillBtn"
        title="Add new skill"
      >
        +
      </button>
    </div>

    <main id="main">
      <!-- Add/Edit Skill Dialog -->
      <dialog id="skillDialog" class="dialog">
        <div class="dialog-content">
          <h2 id="dialogTitle">Add New Skill</h2>
          <form id="skillForm" class="form">
            <div class="form-group">
              <label for="skillId" class="required">Skill ID</label>
              <input
                type="text"
                id="skillId"
                name="skillId"
                placeholder="e.g., SKL001"
                maxlength="16"
                required
              />
            </div>

            <div class="form-group">
              <label for="skillName" class="required">Skill Name</label>
              <input
                type="text"
                id="skillName"
                name="skillName"
                placeholder="e.g., CMM Operation"
                maxlength="60"
                required
              />
            </div>

            <div class="form-group">
              <label for="skillCategory" class="required">Category</label>
              <select id="skillCategory" name="skillCategory" required>
                <option value="">-- Select Category --</option>
                <option value="Technical">Technical</option>
                <option value="Quality">Quality</option>
                <option value="Manufacturing">Manufacturing</option>
                <option value="Administrative">Administrative</option>
                <option value="Soft Skill">Soft Skill</option>
                <option value="Certification">Certification</option>
                <option value="EHS">Environment, Health, and Safety</option>
              </select>
            </div>

            <div class="form-group">
              <label for="skillStatus" class="required">Status</label>
              <select id="skillStatus" name="skillStatus" required>
                <option value="A">Active</option>
                <option value="I">Inactive</option>
              </select>
            </div>

            <div class="form-group">
              <label for="revisionLevel">Revision Level</label>
              <input
                type="text"
                id="revisionLevel"
                name="revisionLevel"
                placeholder="e.g., 1.0"
                maxlength="5"
              />
            </div>

            <div class="form-actions">
              <button type="submit" class="button primary" id="submitBtn">
                Add Skill
              </button>
              <button
                type="button"
                class="button secondary"
                id="cancelBtn"
                onclick="document.getElementById('skillDialog').close()"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>
      </dialog>

      <!-- Skills Table -->
      <div id="skillsContainer" class="table-container"></div>
    </main>
    <footer id="footer"></footer>

    <script type="module" src="/js/skills.mjs"></script>
  </body>
</html>

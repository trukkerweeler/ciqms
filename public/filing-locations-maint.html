<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filing Location Maintenance</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      .page {
        max-width: 1000px;
        margin: 20px auto;
        padding: 20px;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }
      th {
        background: #f5f5f5;
      }
      .actions button {
        margin-right: 8px;
      }
      .modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
      }
      .modal {
        display: none;
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: white;
        width: 480px;
        max-width: 90%;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }
      .form-group {
        margin-bottom: 12px;
      }
      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      .message {
        margin-bottom: 12px;
        padding: 10px;
        border-radius: 4px;
      }
      .message.success {
        background: #e8f5e9;
        color: #2e7d32;
      }
      .message.error {
        background: #ffebee;
        color: #c62828;
      }
    </style>
  </head>
  <body>
    <header id="header"></header>
    <main class="page">
      <div class="toolbar">
        <h1>Filing Location Maintenance</h1>
        <button id="addBtn" class="btn btn-primary">+ Add</button>
      </div>
      <div id="message"></div>
      <table>
        <thead>
          <tr>
            <th>Code</th>
            <th>Location</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>

    <div id="backdrop" class="modal-backdrop"></div>
    <div id="modal" class="modal">
      <h3 id="modalTitle">Add Filing Location</h3>
      <div class="form-group">
        <label for="codeInput">Code</label>
        <input id="codeInput" />
      </div>
      <div class="form-group">
        <label for="locationInput">Location</label>
        <textarea id="locationInput" rows="4"></textarea>
      </div>
      <div
        style="
          display: flex;
          justify-content: flex-end;
          gap: 8px;
          margin-top: 16px;
        "
      >
        <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
        <button id="saveBtn" class="btn btn-primary">Save</button>
      </div>
    </div>

    <footer id="footer"></footer>
    <script type="module" src="/js/filing-locations-maint.mjs"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>QMS Document Search</title>
    <style>
      body {
        font-family:
          Segoe UI,
          Arial,
          sans-serif;
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #222;
      }
      h1 {
        font-size: 1.4rem;
      }
      #searchForm {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      #q {
        flex: 1;
        padding: 0.5rem;
        font-size: 1rem;
      }
      button {
        padding: 0.5rem 1rem;
        font-size: 1rem;
        cursor: pointer;
      }
      .result {
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 0.75rem 1rem;
        margin-bottom: 1rem;
      }
      .result h3 {
        margin: 0 0 0.25rem 0;
        font-size: 1.05rem;
      }
      .result .path {
        font-size: 0.8rem;
        color: #666;
        margin-bottom: 0.5rem;
        word-break: break-all;
      }
      .result .snippet {
        font-size: 0.9rem;
        line-height: 1.4;
        color: #333;
        white-space: pre-wrap;
      }
      .meta {
        font-size: 0.75rem;
        color: #888;
        margin-top: 1rem;
      }
      .empty,
      .error {
        color: #a00;
      }
      #reindexBar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }
      #reindexBtn {
        background: #eef;
      }
      #reindexBtn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #reindexStatus {
        font-size: 0.85rem;
        color: #444;
      }
    </style>
  </head>
  <body>
    <h1>QMS Document Search</h1>
    <div id="reindexBar">
      <button id="reindexBtn" type="button">Reindex</button>
      <span id="reindexStatus"></span>
    </div>
    <form id="searchForm">
      <input
        id="q"
        type="text"
        placeholder="Search QMS documents..."
        autofocus
      />
      <button type="submit">Search</button>
    </form>
    <div id="results"></div>

    <script>
      const form = document.getElementById("searchForm");
      const resultsEl = document.getElementById("results");
      const reindexBtn = document.getElementById("reindexBtn");
      const reindexStatus = document.getElementById("reindexStatus");

      reindexBtn.addEventListener("click", async () => {
        reindexBtn.disabled = true;
        reindexStatus.textContent = "Reindexing... this can take a while.";

        try {
          const res = await fetch("/index-docs", { method: "POST" });
          const data = await res.json();

          if (!res.ok) {
            reindexStatus.textContent = `Reindex failed: ${data.error || res.status}`;
            return;
          }

          reindexStatus.textContent = `Done. Processed ${data.processed}, indexed ${data.indexed}, skipped ${data.skipped?.length ?? 0}, errors ${data.errors?.length ?? 0}.`;
        } catch (error) {
          reindexStatus.textContent = `Reindex failed: ${error.message}`;
        } finally {
          reindexBtn.disabled = false;
        }
      });

      function snippet(text, query) {
        if (!text) return "";
        const idx = text.toLowerCase().indexOf(query.toLowerCase());
        const start = idx > 80 ? idx - 80 : 0;
        const excerpt = text.slice(start, start + 300).trim();
        return (
          (start > 0 ? "..." : "") +
          excerpt +
          (start + 300 < text.length ? "..." : "")
        );
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const query = document.getElementById("q").value.trim();
        if (!query) return;

        resultsEl.innerHTML = "<p>Searching...</p>";

        try {
          const res = await fetch(`/search?q=${encodeURIComponent(query)}`);
          const data = await res.json();

          if (!res.ok) {
            resultsEl.innerHTML = `<p class="error">${data.error || "Search failed"}</p>`;
            return;
          }

          if (!data.hits || data.hits.length === 0) {
            resultsEl.innerHTML = '<p class="empty">No results found.</p>';
            return;
          }

          resultsEl.innerHTML =
            data.hits
              .map(
                (hit) => `
        <div class="result">
          <h3>${hit.filename || "(unnamed file)"}</h3>
          <div class="path">${hit.filePath || ""}</div>
          <div class="snippet">${snippet(hit.text, query)}</div>
        </div>`,
              )
              .join("") +
            `<div class="meta">${data.estimatedTotalHits ?? data.hits.length} result(s) in ${data.processingTimeMs ?? "?"}ms</div>`;
        } catch (error) {
          resultsEl.innerHTML = `<p class="error">${error.message}</p>`;
        }
      });
    </script>
  </body>
</html>

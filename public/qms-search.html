<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>QMS Document Search</title>
    <style>
      body {
        font-family:
          Segoe UI,
          Arial,
          sans-serif;
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #222;
      }
      h1 {
        font-size: 1.4rem;
      }
      #searchForm {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      #filterForm {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      #filterForm input,
      #filterForm select {
        min-width: 0;
        padding: 0.45rem;
      }
      #q {
        flex: 1;
        padding: 0.5rem;
        font-size: 1rem;
      }
      button {
        padding: 0.5rem 1rem;
        font-size: 1rem;
        cursor: pointer;
      }
      .result {
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 0.75rem 1rem;
        margin-bottom: 1rem;
      }
      .result h3 {
        margin: 0 0 0.25rem 0;
        font-size: 1.05rem;
      }
      .result .path {
        font-size: 0.8rem;
        color: #666;
        margin-bottom: 0.5rem;
        word-break: break-all;
      }
      .result .snippet {
        font-size: 0.9rem;
        line-height: 1.4;
        color: #333;
        white-space: pre-wrap;
      }
      .result .snippet em,
      .result h3 em {
        background: #fff0a8;
        font-style: normal;
      }
      .metadata {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 0.75rem;
        margin: 0.5rem 0;
        color: #555;
        font-size: 0.8rem;
      }
      .open-file {
        font-size: 0.85rem;
      }
      #pagination {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 1rem;
      }
      .meta {
        font-size: 0.75rem;
        color: #888;
        margin-top: 1rem;
      }
      .empty,
      .error {
        color: #a00;
      }
      #reindexBar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }
      #reindexBtn {
        background: #eef;
      }
      #reindexBtn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #reindexStatus {
        font-size: 0.85rem;
        color: #444;
      }
    </style>
  </head>
  <body>
    <h1>QMS Document Search</h1>
    <div id="reindexBar">
      <button id="reindexBtn" type="button">Reindex</button>
      <span id="reindexStatus"></span>
    </div>
    <form id="searchForm">
      <input
        id="q"
        type="text"
        placeholder="Search QMS documents..."
        autofocus
      />
      <button type="submit">Search</button>
    </form>
    <form id="filterForm">
      <input id="department" placeholder="Department" />
      <input id="docType" placeholder="Document type" />
      <input id="revision" placeholder="Revision" />
      <select id="controlled">
        <option value="">Controlled status</option>
        <option value="true">Controlled</option>
        <option value="false">Uncontrolled</option>
      </select>
    </form>
    <div id="results"></div>

    <script>
      const form = document.getElementById("searchForm");
      const resultsEl = document.getElementById("results");
      const reindexBtn = document.getElementById("reindexBtn");
      const reindexStatus = document.getElementById("reindexStatus");
      const pageSize = 20;
      let currentOffset = 0;

      reindexBtn.addEventListener("click", async () => {
        reindexBtn.disabled = true;
        reindexStatus.textContent = "Reindexing... this can take a while.";

        try {
          const res = await fetch("/index-docs", { method: "POST" });
          const data = await res.json();

          if (!res.ok) {
            reindexStatus.textContent = `Reindex failed: ${data.error || res.status}`;
            return;
          }

          reindexStatus.textContent = `Done. Processed ${data.processed}, indexed ${data.indexed}, skipped ${data.skipped?.length ?? 0}, errors ${data.errors?.length ?? 0}.`;
        } catch (error) {
          reindexStatus.textContent = `Reindex failed: ${error.message}`;
        } finally {
          reindexBtn.disabled = false;
        }
      });

      function snippet(text, query) {
        if (!text) return "";
        const idx = text.toLowerCase().indexOf(query.toLowerCase());
        const start = idx > 80 ? idx - 80 : 0;
        const excerpt = text.slice(start, start + 300).trim();
        return (
          (start > 0 ? "..." : "") +
          excerpt +
          (start + 300 < text.length ? "..." : "")
        );
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function safeHighlight(value) {
        return escapeHtml(value)
          .replaceAll("&lt;em&gt;", "<em>")
          .replaceAll("&lt;/em&gt;", "</em>");
      }

      function fileUrl(filePath) {
        if (!filePath || !filePath.startsWith("\\\\")) return null;
        return `file:${filePath.replaceAll("\\", "/")}`;
      }

      function renderPagination(data) {
        const total = data.estimatedTotalHits ?? 0;
        if (total <= pageSize && currentOffset === 0) return "";
        return `<div id="pagination">
          <button id="previousPage" type="button" ${currentOffset === 0 ? "disabled" : ""}>Previous</button>
          <span>Showing ${total === 0 ? 0 : currentOffset + 1}-${Math.min(currentOffset + pageSize, total)} of about ${total}</span>
          <button id="nextPage" type="button" ${currentOffset + pageSize >= total ? "disabled" : ""}>Next</button>
        </div>`;
      }

      async function runSearch() {
        const query = document.getElementById("q").value.trim();
        if (!query) return;

        resultsEl.innerHTML = "<p>Searching...</p>";
        const params = new URLSearchParams({
          q: query,
          limit: pageSize,
          offset: currentOffset,
        });
        ["department", "docType", "revision", "controlled"].forEach((field) => {
          const value = document.getElementById(field).value.trim();
          if (value) params.set(field, value);
        });

        try {
          const res = await fetch(`/search?${params}`);
          const data = await res.json();

          if (!res.ok) {
            resultsEl.innerHTML = `<p class="error">${escapeHtml(data.error || "Search failed")}</p>`;
            return;
          }

          if (!data.hits || data.hits.length === 0) {
            resultsEl.innerHTML = '<p class="empty">No results found.</p>';
            return;
          }

          resultsEl.innerHTML =
            data.hits
              .map((hit) => {
                const formatted = hit._formatted || {};
                const displayTitle = formatted.title
                  ? safeHighlight(formatted.title)
                  : escapeHtml(hit.filename || "(unnamed file)");
                const displayText = formatted.text
                  ? safeHighlight(formatted.text)
                  : escapeHtml(hit.text || "");
                const url = fileUrl(hit.filePath);
                return `<div class="result">
              <h3>${displayTitle}</h3>
              <div class="path">${escapeHtml(hit.filePath || "")}</div>
              <div class="metadata">
                ${hit.docType ? `<span>Type: ${escapeHtml(hit.docType)}</span>` : ""}
                ${hit.revision ? `<span>Revision: ${escapeHtml(hit.revision)}</span>` : ""}
                ${hit.department ? `<span>Department: ${escapeHtml(hit.department)}</span>` : ""}
                ${hit.clauseRefs?.length ? `<span>Clauses: ${escapeHtml(hit.clauseRefs.join(", "))}</span>` : ""}
              </div>
              <div class="snippet">${displayText}</div>
              ${url ? `<p><a class="open-file" href="${escapeHtml(url)}">Open file</a></p>` : ""}
            </div>`;
              })
              .join("") +
            `<div class="meta">${data.estimatedTotalHits ?? data.hits.length} result(s) in ${data.processingTimeMs ?? "?"}ms</div>` +
            renderPagination(data);

          document
            .getElementById("previousPage")
            ?.addEventListener("click", () => {
              currentOffset = Math.max(0, currentOffset - pageSize);
              runSearch();
            });
          document.getElementById("nextPage")?.addEventListener("click", () => {
            currentOffset += pageSize;
            runSearch();
          });
        } catch (error) {
          resultsEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        currentOffset = 0;
        runSearch();
      });

      document
        .getElementById("filterForm")
        .addEventListener("submit", (e) => e.preventDefault());
    </script>
  </body>
</html>
